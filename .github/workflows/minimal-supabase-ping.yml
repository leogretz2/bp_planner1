name: Minimal Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC every day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Supabase with curl # Use minimal curl command with no libraries, because pnpm-lock.yaml is not supported by GitHub actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_KEY environment variable (set in repository secrets)"
            exit 2
          fi

          # derived fields
          HOST=$(echo "${SUPABASE_URL}" | sed -E 's#https?://##; s#/*$##')

          # REST endpoint to query a tiny row set from a seeded table
          URL="${SUPABASE_URL}/rest/v1/projects?select=id&limit=1"

          echo "Supabase host: ${HOST}"
          echo "Query URL: ${URL}"

          echo "Resolver configuration (/etc/resolv.conf):"
          cat /etc/resolv.conf || true

          echo
          echo "Testing DNS resolution with nslookup (installing dnsutils)..."
          apt-get update -qq && apt-get install -y -qq dnsutils || true
          echo "nslookup ${HOST}:"
          nslookup "${HOST}" || true

          echo "Testing basic outbound connectivity (github.com)"
          curl -sSf -o /dev/null https://api.github.com || echo "Warning: connectivity to api.github.com failed"

          # Try up to 6 times with exponential backoff
          attempt=0
          max_attempts=6
          backoff=2

          while :; do
            attempt=$((attempt + 1))
            echo "Ping attempt $attempt -> $URL"
            http_code=$(curl -sS -w "%{http_code}" -o /tmp/ping.json \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "${URL}" || echo "000")

            # print a small preview of returned payload for debugging (will be masked if secret contains it)
            if [ -s /tmp/ping.json ]; then
              echo "Returned JSON (preview):"
              head -n 10 /tmp/ping.json || true
            fi

            if [ "$http_code" = "200" ]; then
              echo "Ping OK (HTTP 200)."
              exit 0
            fi

            echo "Ping failed (HTTP $http_code)."

            if [ "${http_code}" = "000" ]; then
              echo "curl returned 000 — likely DNS or network error."
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "All ${max_attempts} failed. Gathering diagnostics..."
              
              echo "--- DNS lookup (host) ---"
              nslookup "${HOST}" || true

              echo "--- ping google DNS 1.1.1.1 (ICMP may be blocked) ---"
              ping -c 2 1.1.1.1 || true

              echo "--- curl to example.com ---"
              curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://example.com || true

              echo "Exiting with failure so the run is marked failed."
              exit 1
            fi

            sleep_seconds=$((backoff ** attempt))
            echo "Retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
