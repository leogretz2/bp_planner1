name: Direct Supabase Ping

on:
  schedule:
    - cron: "0 10 */3 * *"   # 10:00 UTC every 3 days
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase Postgres directly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing DATABASE_URL secret"
            exit 2
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

          echo "Pinging Postgres..."
          psql "${DATABASE_URL}" -c "SELECT 1;" && echo "Postgres ping OK." && exit 0

          echo "::error::Postgres ping failed"
          exit 1

      - name: Fallback – restore via Management API
        if: failure()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF – cannot attempt restore"
            exit 1
          fi

          echo "Project appears paused. Attempting restore..."
          http_code=$(curl -sS -w "%{http_code}" -o /tmp/restore.json -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")

          cat /tmp/restore.json 2>/dev/null || true

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            echo "Restore triggered (HTTP $http_code). Project should be back shortly."
            exit 0
          fi

          echo "::error::Restore failed (HTTP $http_code)"
          exit 1
