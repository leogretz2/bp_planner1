name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: "0 10 */2 * *"   # 10:00 UTC every 2 days
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      # --- Layer 1: Call the RPC function via REST API ---
      - name: Ping via RPC function
        id: rpc_ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          echo "Calling RPC ping function..."
          http_code=$(curl -sS -w "%{http_code}" -o /tmp/rpc.json \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "000")

          if [ -s /tmp/rpc.json ]; then
            echo "Response:"
            cat /tmp/rpc.json
          fi

          if [ "$http_code" = "200" ]; then
            echo "RPC ping OK (HTTP 200)."
            exit 0
          fi

          echo "::warning::RPC ping failed (HTTP $http_code)"
          exit 1

      # --- Layer 2: Direct Postgres connection ---
      - name: Ping via direct Postgres connection
        id: pg_ping
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL not set, skipping"
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

          echo "Attempting direct Postgres ping..."
          psql "${DATABASE_URL}" -c "SELECT public.ping();" && echo "Postgres ping OK." && exit 0

          echo "::warning::Direct Postgres ping failed"
          exit 1

      # --- Layer 3: Restore paused project via Management API ---
      - name: Restore via Management API
        if: failure()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF"
            exit 1
          fi

          echo "Both pings failed. Attempting project restore..."
          http_code=$(curl -sS -w "%{http_code}" -o /tmp/restore.json -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")

          cat /tmp/restore.json 2>/dev/null || true

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
            echo "Restore triggered (HTTP $http_code)."
            exit 0
          fi

          echo "::error::Restore failed (HTTP $http_code)"
          exit 1
