name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: "0 10 * * 2,5"  # 10:00 UTC every Tuesday and Friday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubtuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          
      - name: Install supabase client
        run: npm init -y && npm install @supabase/supabase-js --no-audit --no-fund
      - name: Ping Supabases (query projects)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node - <<'NODE'
          (async () => {
            try {
              const { createClient } = require('@supabase/supabase-js');
              
              const url = process.env.SUPABASE_URL;
              const key = process.env.SUPABASE_KEY;

              if (!url || !key) {
                console.error('Missing SUPABASE_URL or SUPABASE_KEY env var.');
                process.exit(1);
              }

              // Create server-side client (service key / secret)
              const supabase = createClient(url, key, { auth: { persistSession: false } });

              // Lightweight query against a seeded table
              const { data, error } = await supabase
                .from('projects')
                .select('id')
                .limit(1);

              if (error) {
                console.error('Supabase query error:', error.message ?? error);
                console.error('Full error:', JSON.stringify(error,null,2));
                process.exit(1);
              }

              console.log(`Ping OK - status: ${status}, rows returned: ${Array.isArray(data) ? data.length : 0}`);
              process.exit(0);
            } catch (err) {
              console.error('Unexpected runtime error:', err);
              process.exit(1);
            }
          })();
          NODE
                
